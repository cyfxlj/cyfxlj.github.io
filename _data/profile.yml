short_bio_text_justify: false
short_bio: >-
  <p>
    I'm a third-year master's student at the
    <a href="https://fit.fudan.edu.cn/" target="_blank">College of Future Information Technology</a>, Fudan University,
    advised by Prof. <a href="https://fit.fudan.edu.cn/En/Data/View/2988" target="_blank">Feng Wang</a>.
    Prior to this, I received my bachelor's degree from Ningbo University (Yangming Innovation Class).
    I have also interned at SenseTime Research (Foundation Model Team, Coding) and Alibaba Taobao & Tmall Group.
  </p>
  <p>
    My research interests include, but are not limited to:
  </p>
  <ul>
    <li><strong>3D Reconstruction from Radar Imagery:</strong> ISAR Imaging, Neural Radiance Fields, Gaussian Splatting</li>
    <li><strong>Multimodal Remote Sensing:</strong> Vision-Language Models, Few-Shot Classification</li>
    <li><strong>Large Language Models:</strong> Code Generation, Post-training, Reinforcement Learning</li>
  </ul>
  <p>
    Feel free to reach out if you are interested in my work or would like to collaborate.
  </p>

